---
- name: Configure webtext-app VM
  hosts: webtext_vms
  become: true
  gather_facts: true

  vars:
    task_version: "3.45.4"
    app_repo: "https://github.com/NikhilRaj-DevOps/vetology-devops-exercise.git"
    app_path: "/opt/vetology-devops-exercise"

  tasks:
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
        state: present
        update_cache: true

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker.io
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add remote user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_path }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Check out the application repository
      become: false
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_path }}"
        version: main
        update: true

    - name: Download Task installer
      ansible.builtin.get_url:
        url: https://taskfile.dev/install.sh
        dest: /tmp/task-install.sh
        mode: "0755"

    - name: Install Task
      ansible.builtin.command:
        cmd: "/tmp/task-install.sh -d -b /usr/local/bin v{{ task_version }}"
        creates: /usr/local/bin/task

    - name: Download Doppler installer
      ansible.builtin.get_url:
        url: https://cli.doppler.com/install.sh
        dest: /tmp/doppler-install.sh
        mode: "0755"

    - name: Check whether Doppler CLI is installed
      ansible.builtin.command: which doppler
      register: doppler_installed
      changed_when: false
      failed_when: false

    - name: Install Doppler CLI
      ansible.builtin.command:
        cmd: /tmp/doppler-install.sh
      when: doppler_installed.rc != 0

    - name: Verify Docker installation
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify application source checkout
      become: false
      ansible.builtin.command: git -C "{{ app_path }}" status --short --branch
      changed_when: false

    - name: Verify Task installation
      ansible.builtin.command: task --version
      register: task_version_output
      changed_when: false

    - name: Verify Doppler installation
      ansible.builtin.command: doppler --version
      register: doppler_version_output
      changed_when: false

    - name: Display installed tool versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ task_version_output.stdout }}"
          - "{{ doppler_version_output.stdout }}"
